name: OIDF Publication Checks
on:
  pull_request:
    branches:
    - main
  workflow_dispatch:

concurrency:
  group: publication-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Run automated checks on proposed OIDF specs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check branch naming
        if: >
          github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'propose/') &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **This PR is not from a `propose/` branch.** Publication checks have been skipped.\n\nIf this is a direct fix to `sync/specs/`, this is expected and you need to carefully check this change manually. If this is a new spec submission, please use a branch named `propose/{wg-name}/...`.'
            });

      - uses: actions/checkout@v6
        if: startsWith(github.head_ref || '', 'propose/') || github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0

      - name: Checkout publication-checks
        if: startsWith(github.head_ref || '', 'propose/') || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          repository: openid/publication-checks
          path: openid-workflow
          ssh-key: ${{ secrets.OPENID_PUBLICATION_DEPLOY_KEY }}

      - name: Set up Python
        if: startsWith(github.head_ref || '', 'propose/') || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Python requirements
        if: startsWith(github.head_ref || '', 'propose/') || github.event_name == 'workflow_dispatch'
        run: |
          cd ./openid-workflow
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OpenID pre-publication checks
        if: startsWith(github.head_ref || '', 'propose/') || github.event_name == 'workflow_dispatch'
        id: checks
        run: |
          set -o pipefail
          cd ./openid-workflow
          python3 process.py 2>&1 | tee "$RUNNER_TEMP/checks-output.txt"
        continue-on-error: true

      - name: Build check results summary
        if: always() && steps.checks.outcome != '' && steps.checks.outcome != 'skipped'
        run: |
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/checks-output.txt" > "$RUNNER_TEMP/checks-clean.txt"

          SUMMARY="$RUNNER_TEMP/checks-summary.md"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "## 📋 Publication Check Results${HEAD_SHA:+ for ${HEAD_SHA:0:7}}" > "$SUMMARY"
          echo "" >> "$SUMMARY"

          PR_NUM="${{ github.event.pull_request.number }}"
          PREVIEW_BASE="https://openid.github.io/publication/PREVIEW-DO-NOT-USE/pr-${PR_NUM}"

          PASS_COUNT=$(grep -c "^PASS:" "$RUNNER_TEMP/checks-clean.txt" || true)
          # process.py ends each file with "FAIL: <file> did not pass all checks";
          # that is a summary of the items above it, not an item itself.
          FILE_SUMMARY_LINE="did not pass all checks"
          FAIL_COUNT=$(grep "^FAIL:" "$RUNNER_TEMP/checks-clean.txt" | grep -cv "$FILE_SUMMARY_LINE" || true)
          WARN_COUNT=$(grep -c "^WARNING:" "$RUNNER_TEMP/checks-clean.txt" || true)

          if [ "${{ steps.checks.outcome }}" = "success" ]; then
            echo "### ✅ All checks passed" >> "$SUMMARY"
          else
            echo "### ❌ Some checks failed" >> "$SUMMARY"
          fi
          echo "" >> "$SUMMARY"
          echo "| | Count |" >> "$SUMMARY"
          echo "|---|---|" >> "$SUMMARY"
          echo "| ✅ Passed | $PASS_COUNT |" >> "$SUMMARY"
          echo "| ❌ Failed | $FAIL_COUNT |" >> "$SUMMARY"
          echo "| ⚠️ Warnings | $WARN_COUNT |" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          # linkify: replace wg/spec.html paths with [spec.html](preview_url) links.
          # The path must stand on its own (start of line, space or bracket
          # before it) so that the tail of a full URL is not mistaken for one.
          linkify() {
            local line="$1"
            local path_re='(^|[[:space:](])([a-z-]+/[a-z0-9_-]+\.html)'
            if [[ "$line" =~ $path_re ]]; then
              local fpath="${BASH_REMATCH[2]}"
              local fname
              fname="${fpath##*/}"
              local url="${PREVIEW_BASE}/${fname}"
              line="${line//$fpath/[$fpath]($url)}"
            fi
            echo "$line"
          }

          # emit_items PREFIX: one bullet per line starting with PREFIX (the
          # prefix itself is dropped - the section heading already says it),
          # with any indented diagnostic lines that immediately follow it
          # nested underneath. process.py indents those with two spaces.
          # Diagnostics are found-vs-expected values (markup, regexes, dates)
          # so they are always shown as code, which also stops GitHub from
          # swallowing HTML tags. The per-file summary line is not an item.
          emit_items() {
            local prefix="$1"
            local in_item=0
            local line detail
            while IFS= read -r line; do
              if [[ "$line" == "$prefix "* ]]; then
                echo "- $(linkify "${line#"$prefix" }")" >> "$SUMMARY"
                in_item=1
              elif [[ $in_item -eq 1 && "$line" == "  "* ]]; then
                detail="${line#"${line%%[![:space:]]*}"}"   # trim leading whitespace
                detail="${detail#- }"
                echo "  - \`${detail//\`/\'}\`" >> "$SUMMARY"
              else
                in_item=0
              fi
            done < <(grep -v "$FILE_SUMMARY_LINE" "$RUNNER_TEMP/checks-clean.txt")
          }

          if [ "$FAIL_COUNT" -gt 0 ] 2>/dev/null; then
            echo "### ❌ Failures" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            emit_items "FAIL:"
            echo "" >> "$SUMMARY"
            echo "See [ERROR-MODES.md](https://github.com/openid/publication/blob/main/ERROR-MODES.md) for guidance on fixing each failure." >> "$SUMMARY"
          fi

          if [ "$WARN_COUNT" -gt 0 ] 2>/dev/null; then
            echo "" >> "$SUMMARY"
            echo "### ⚠️ Warnings" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            emit_items "WARNING:"
          fi

          # Add preview links for all checked HTML files
          HTML_FILES=$(grep "^Processing file:" "$RUNNER_TEMP/checks-clean.txt" | sed 's/Processing file: //' || true)
          if [ -n "$HTML_FILES" ]; then
            echo "" >> "$SUMMARY"
            echo "### Preview" >> "$SUMMARY"
            echo "" >> "$SUMMARY"
            while read -r fpath; do
              fname=$(basename "$fpath")
              echo "- [$fpath](${PREVIEW_BASE}/${fname})" >> "$SUMMARY"
            done <<< "$HTML_FILES"
            echo "" >> "$SUMMARY"
          fi

          echo "" >> "$SUMMARY"
          echo "See the [full log](PLACEHOLDER_JOB_URL) for more detailed diagnostics." >> "$SUMMARY"

          # Also show the summary on the workflow run page; fork PRs get no
          # comment (read-only token), so this is the only place they see it
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: >
          always() && steps.checks.outcome != '' && steps.checks.outcome != 'skipped' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const job = jobs.data.jobs.find(j => j.name === 'Run automated checks on proposed OIDF specs');
            const jobUrl = job ? job.html_url
              : `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = fs.readFileSync(`${process.env.RUNNER_TEMP}/checks-summary.md`, 'utf8')
              .replace('PLACEHOLDER_JOB_URL', jobUrl);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail if checks failed
        if: steps.checks.outcome == 'failure'
        run: |
          cat "$RUNNER_TEMP/checks-output.txt"
          echo ""
          echo "See ERROR-MODES.md for guidance: https://github.com/openid/publication/blob/main/ERROR-MODES.md"
          exit 1
